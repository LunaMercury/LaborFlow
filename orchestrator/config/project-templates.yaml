auth:
  roleContracts:
    frontend:
      - "Document the backend login entry point, token storage policy, and authenticated API error handling."
    rust:
      - "Document the JWT claims backend-fast must validate or explicitly ignore for realtime and upload paths."
    java:
      - "Document identity source, user mapping, role/permission rules, JWT issuance, and token expiry contract."
    mobile:
      - "Document whether mobile performs login directly or only consumes backend-issued JWTs, plus secure token storage."

design:
  verifierChecks:
    - "Confirm LaborFlow UI uses React, TypeScript, CSS Modules, accessible Korean copy, and no placeholder domain features."

redis:
  verifierChecks:
    - "Confirm Redis runs as laborflow_redis on localhost:56379 for local development."
    - "Confirm Redis usage is limited to cache, rate limit counters, idempotency keys, distributed locks, and realtime fan-out support."
    - "Confirm TTL, key namespace, invalidation, fallback, and no-raw-PII rules are documented before adding Redis-backed features."

deployment:
  verifierChecks:
    - "Confirm Windows scripts remain in run-windows.bat/stop-windows.bat and Linux scripts remain in run-linux.sh/stop-linux.sh."
    - "Confirm production compose and Dockerfiles do not hardcode real secrets."
    - "Confirm public traffic enters through the edge reverse proxy and production HTTPS/domain settings are environment-driven."
    - "Confirm Linux shell scripts use repo-relative paths and LF line endings."
    - "Confirm .env.example contains placeholders only and real .env files stay ignored."

data:
  verifierChecks:
    - "Confirm schema changes are added under database/migrations and packaged through backend-core Flyway resources."
    - "Confirm migrations avoid raw plaintext secrets and document sensitive encrypted/hash columns."

enterprise:
  verifierChecks:
    - "Confirm backend-core feature packages use api/application/dto/dao layers and shared infrastructure stays under common."
    - "Confirm PostgreSQL remains the source of truth for personal data, attendance, schedules, workflow history, and audit logs."
    - "Confirm high-traffic writes define idempotency, transaction boundary, audit behavior, and cache invalidation before implementation."

realtime:
  verifierChecks:
    - "Confirm LaborFlow WebSocket event names, payloads, authentication, authorization, and origin policy before implementation."

attendance:
  roleContracts:
    frontend:
      - "Document attendance UI states, empty states, and timezone display rules before implementing flows."
    java:
      - "Document attendance write rules, audit history, timezone source, and permission checks."
    rust:
      - "Review latency-sensitive attendance fan-out only when realtime updates are requested."
    mobile:
      - "Document offline capture, retry, and background transfer behavior before implementing field flows."
