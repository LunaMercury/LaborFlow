name: LaborFlow
goal: 인력 관리, 근태, 일정, 업무 흐름을 관리하는 앱
priorities:
  - Preserve fast response on latency-sensitive paths
  - Keep authentication and authorization server-enforced
  - Keep local development and verification reproducible
modules:
  frontend: web/** (React + TypeScript + CSS Modules user interface)
  java: backend-core/** (Spring Boot accounts, attendance, scheduling, history, and core business rules)
  rust: backend-fast/** (Rust latency-sensitive upload, realtime fan-out, and streaming paths)
  mobile: mobile/** (Android Kotlin field client, token storage, capture, and background transfer)
contracts:
  - Health endpoints are web UI ready state, backend-core /api/health, backend-fast /health, and Android debug build.
  - Before auth work, document shared JWT claims, signing algorithm, expiry policy, and secret environment variable.
  - Before data work, document local database URL, port, migration strategy, retention policy, and deletion policy.
  - Before realtime work, document API and WebSocket base URL environment variables, event names, payloads, and origin policy.
  - Frontend and mobile must not receive provider client secrets, service tokens, private keys, or database credentials.
policySources:
  - AGENTS.md
  - security_guidelines.md
  - system_architecture.md
