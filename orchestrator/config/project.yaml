name: LaborFlow
goal: 인력 관리, 근태, 일정, 업무 흐름을 관리하는 엔터프라이즈급 앱
priorities:
  - Preserve fast response on traffic-spike paths
  - Keep authentication and authorization server-enforced
  - Protect personal data and avoid secret exposure
  - Keep local development and verification reproducible
modules:
  frontend: web/** (React + TypeScript + CSS Modules user interface)
  java: backend-core/** (Spring Boot accounts, attendance, scheduling, history, Redis cache/lock policy, and core business rules)
  rust: backend-fast/** (Rust latency-sensitive upload, realtime fan-out, and streaming paths)
  mobile: mobile/** (Android Kotlin field client, token storage, capture, and background transfer)
  data: database/** and docker-compose*.yaml (Flyway-managed PostgreSQL migrations plus local/production runtime dependencies)
  deployment: Dockerfile, docker-compose.prod.yaml, run-linux.sh, stop-linux.sh, run-windows.bat, stop-windows.bat
contracts:
  - Local health endpoints are web http://localhost:5580, backend-core http://localhost:5581/api/health, backend-fast http://localhost:5582/health, and Android debug build.
  - Local PostgreSQL uses localhost:55432, database laborflow_db, and temporary dev defaults that can be overridden by .env.
  - Local Redis uses localhost:56379, container laborflow_redis, and temporary dev defaults that can be overridden by .env.
  - Production deployments must use docker-compose.prod.yaml or equivalent infrastructure with secrets injected outside Git.
  - Ubuntu/Linux verification scripts live beside Windows scripts under .skills and must remain path-relative.
  - PostgreSQL schema changes must be added under database/migrations and applied by backend-core Flyway packaging.
  - PostgreSQL is the source of truth for personal data, attendance records, schedules, workflow history, and audit trails.
  - Attendance records use Asia/Seoul as the business timezone; confirmed manual records must not be overwritten by bulk planned-attendance confirmation.
  - Attendance task notes are stored separately from planning memos and retain account-attributed revision history in PostgreSQL.
  - A no-show response records ABSENT attendance, preserves the original assignment as REPLACED, and stores the replacement link in PostgreSQL instead of deleting history.
  - No-show replacement changes and cancellations retain account-attributed revision history; cancellation restores the captured original assignment and attendance state and soft-deletes only replacement records created by the no-show flow.
  - A replacement worker with an overlapping assignment remains selectable only after the operator explicitly acknowledges the time-conflict warning.
  - Manual no-show risk flags and observed no-show incident counts are separate signals; clearing a manual flag must not erase incident history.
  - Redis is limited to short-lived cache, rate limit counters, idempotency keys, distributed locks, and realtime fan-out support.
  - Redis keys and values must not contain raw personal data, passwords, provider secrets, or long-lived audit records.
  - Backend-core feature packages use api/application/dto/dao layers; shared infrastructure belongs under common only when reused across domains.
  - Before auth work, document shared JWT claims, signing algorithm, expiry policy, token storage, and secret environment variable.
  - Before data work, document migration strategy, retention policy, deletion policy, and Redis invalidation/fallback policy.
  - Before realtime work, document API and WebSocket/SSE base URL environment variables, event names, payloads, authorization, and origin policy.
  - Frontend and mobile must not receive provider client secrets, service tokens, private keys, database credentials, or Redis credentials.
policySources:
  - AGENTS.md
  - security_guidelines.md
  - system_architecture.md
  - enterprise_policies.md
