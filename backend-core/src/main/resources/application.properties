spring.application.name=laborflow-core
server.port=${SERVER_PORT:5581}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/laborflow_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:56379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:admin}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
spring.cache.type=redis
spring.cache.redis.time-to-live=${SPRING_CACHE_REDIS_TTL:300s}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:0}
laborflow.web.allowed-origins=${LABORFLOW_WEB_ALLOWED_ORIGINS:http://localhost:5580,http://127.0.0.1:5580}
laborflow.web.allowed-origin-patterns=${LABORFLOW_WEB_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
