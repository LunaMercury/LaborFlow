services:
  postgres:
    image: postgres:18
    container_name: laborflow_db
    ports:
      - "${DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laborflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-laborflow_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - laborflow-postgres18-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: laborflow_redis
    ports:
      - "${REDIS_PORT:-56379}:6379"
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:-admin}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-admin}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - laborflow-redis8-data:/data

volumes:
  laborflow-postgres18-data:
  laborflow-redis8-data:
