services:
  postgres:
    image: postgres:18
    container_name: laborflow_db
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: laborflow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d laborflow_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - laborflow-postgres18-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: laborflow_redis
    ports:
      - "56379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "admin"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a admin ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - laborflow-redis8-data:/data

volumes:
  laborflow-postgres18-data:
  laborflow-redis8-data:
